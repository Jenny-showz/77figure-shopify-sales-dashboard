name: Update dashboard data

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-dashboard-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
      SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
      ERP_DB_HOST: ${{ secrets.ERP_DB_HOST }}
      ERP_DB_PORT: ${{ secrets.ERP_DB_PORT }}
      ERP_DB_NAME: ${{ secrets.ERP_DB_NAME }}
      ERP_DB_USER: ${{ secrets.ERP_DB_USER }}
      ERP_DB_PASSWORD: ${{ secrets.ERP_DB_PASSWORD }}
      DASHBOARD_UPDATE_TIMEOUT_MS: 600000
      DASHBOARD_UPDATE_ATTEMPTS: 2
      SHOPIFY_REQUEST_TIMEOUT_MS: 30000
      SHOPIFY_REQUEST_ATTEMPTS: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Validate secrets
        run: |
          test -n "$(printf '%s' "$SHOPIFY_STORE_DOMAIN" | xargs)"
          test -n "$(printf '%s' "$SHOPIFY_ACCESS_TOKEN" | xargs)"
          test -n "$(printf '%s' "$ERP_DB_HOST" | xargs)"
          test -n "$(printf '%s' "$ERP_DB_NAME" | xargs)"
          test -n "$(printf '%s' "$ERP_DB_USER" | xargs)"
          test -n "$(printf '%s' "$ERP_DB_PASSWORD" | xargs)"

      - name: Install dependencies
        run: npm ci

      - name: Build dashboard data
        run: node scripts/run-dashboard-update.mjs

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dashboard.json data/last-run.json
          if git diff --cached --quiet; then
            echo "No dashboard data changes to commit."
            exit 0
          fi
          git commit -m "Update dashboard data"
          git push
