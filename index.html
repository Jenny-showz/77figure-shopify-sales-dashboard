<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>第 14 级部署练习</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f7fb;
        color: #172033;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(720px, calc(100vw - 32px));
        padding: 32px;
        background: #ffffff;
        border: 1px solid #d9e0ec;
        border-radius: 8px;
        box-shadow: 0 18px 45px rgba(23, 32, 51, 0.08);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 28px;
        line-height: 1.25;
        letter-spacing: 0;
      }

      p {
        margin: 0 0 16px;
        font-size: 16px;
        line-height: 1.7;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-radius: 6px;
        background: #eef8f0;
        color: #176b35;
        font-weight: 600;
      }

      .status::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: currentColor;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>第 14 级部署练习</h1>
      <p>这是一个最小静态网页，用来练习从本地验证到 GitHub Pages 线上验证的完整闭环。</p>
      <p class="status">本地页面已准备，等待部署验证</p>
    </main>
  </body>
</html>
